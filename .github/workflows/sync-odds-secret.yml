name: Sincronizar secret The Odds API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de GitHub/AWS
        type: choice
        options: [dev]
        default: dev
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLICATION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pickbros-odds-secret-sync

      - name: Publicar THE_ODDS_API_KEY en Secrets Manager
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${THE_ODDS_API_KEY}" ]; then
            echo "Falta THE_ODDS_API_KEY en el environment ${GITHUB_ENVIRONMENT_NAME:-dev}."
            exit 1
          fi

          SECRET_ID="pickbros-${{ inputs.environment }}/the-odds-api-key"

          if ! aws secretsmanager describe-secret --secret-id "${SECRET_ID}" >/dev/null 2>&1; then
            echo "No existe ${SECRET_ID}."
            echo "Primero aplica Terraform en pickbros-infra (módulo app-secrets)."
            exit 1
          fi

          aws secretsmanager put-secret-value \
            --secret-id "${SECRET_ID}" \
            --secret-string "${THE_ODDS_API_KEY}"

          echo "Secret actualizado: ${SECRET_ID}"
